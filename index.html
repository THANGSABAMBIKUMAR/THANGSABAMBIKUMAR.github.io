<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Energy Meter Dashboard</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle, #002d62 0%, #000b1a 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #002d62;
        }

        h1 {
            color: white;
            margin-top: 50px;
            letter-spacing: 2px;
            font-size: 2.5rem;
            text-transform: uppercase;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 200px);
            gap: 40px;
            margin-top: 60px;
        }

        .card {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: scale(1.05);
        }

        .icon-box {
            width: 180px;
            height: 180px;
            background: linear-gradient(135deg, #4da3ff 0%, #00cc66 100%);
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            /* Placeholder for the bolt/leaf logo background */
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" opacity="0.2"><path d="M50 10 L30 50 H50 L40 90 L70 40 H50 Z" fill="white"/></svg>');
        }

        .inner-white-box {
            background: white;
            width: 120px;
            height: 60px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
        }

        .label {
            background: white;
            width: 220px;
            padding: 12px 0;
            margin-top: -20px;
            text-align: center;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1.1rem;
            box-shadow: 5px 5px 0px rgba(0,0,0,0.2);
            z-index: 2;
        }

        .logout-btn {
            margin-top: 60px;
            background: white;
            padding: 12px 80px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 5px 5px 0px rgba(0,0,0,0.2);
            border: none;
            color: #002d62;
        }

        /* Simple Icons using Unicode or Emoji for demonstration */
        .icon { font-size: 35px; }

    </style>
</head>
<body>

    <h1>Smart Energy Meter</h1>

    <div class="grid-container">
        <div class="card">
            <div class="icon-box">
                <div class="inner-white-box"><span class="icon">📊</span></div>
            </div>
            <div class="label">Usage Analytics</div>
        </div>

        <div class="card">
            <div class="icon-box">
                <div class="inner-white-box"><span class="icon">👥</span></div>
            </div>
            <div class="label">Customer Details</div>
        </div>

        <div class="card">
            <div class="icon-box">
                <div class="inner-white-box"><span class="icon">⚙️</span></div>
            </div>
            <div class="label">Control & Remote</div>
        </div>

        <div class="card">
            <div class="icon-box">
                <div class="inner-white-box"><span class="icon">🔔</span></div>
            </div>
            <div class="label">Alert & Notification</div>
        </div>
    </div>

    <button class="logout-btn">Logout</button>

</body>
</html>
